name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check package
        run: npm run check
  # peerDependencies are "*", so users run this package on Pi releases the pinned dev host predates.
  # This job runs the same gates against the two hosts that define the supported range: the measured floor
  # (COMPAT_FLOOR in scripts/check-host-compat.mjs) and the latest published host.
  host-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor host runs the runtime contract only (typecheck, packed artifact, host API probe): the
          # recall-eval rig in tests/ resolves models through the newest host registry and cannot pass there.
          - pi: floor
            stages: --runtime-only
          # Latest runs everything the pinned dev host runs, suite included.
          - pi: latest
            stages: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Check against Pi ${{ matrix.pi }}
        run: node scripts/check-host-compat.mjs --host ${{ matrix.pi }} ${{ matrix.stages }}
